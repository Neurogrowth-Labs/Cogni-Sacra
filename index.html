
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/cogni-sacra.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CogniSacra Academy - AI-Powered Education Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              crimson: {
                DEFAULT: '#A51C30',
                dark: '#8a1628',
                light: '#d44d5f',
              },
              gray: {
                50: '#F8F9FA',   // Surface
                100: '#F3F4F6',
                200: '#E5E7EB',  // Border
                300: '#D1D5DB',
                400: '#9CA3AF',
                500: '#6B7280',  // Text Secondary
                600: '#4B5563',
                700: '#374151',
                800: '#1F2937',
                900: '#111827',  // Text Primary
              },
              success: '#10B981',
              warning: '#F59E0B',
              error: '#EF4444'
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Lora', 'serif'],
            },
            boxShadow: {
              'glass': '0 2px 10px 0 rgba(0, 0, 0, 0.02)',
              'glass-dark': '0 2px 10px 0 rgba(0, 0, 0, 0.15)',
              'glow': '0 0 10px rgba(165, 28, 48, 0.1)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg-color: #FFFFFF;
        --text-color: #111827;
        --transition-speed: 250ms;
        --transition-timing: cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      .dark {
        --bg-color: #0A0F1D;
        --text-color: #F8F9FA;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color) !important;
        background-image: none !important;
        color: var(--text-color);
        transition: background-color var(--transition-speed) var(--transition-timing);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .perspective-container {
        perspective: 1500px;
      }

      .preserve-3d {
        transform-style: preserve-3d;
      }

      .rotate-y-180 {
        transform: rotateY(180deg);
      }

      .backface-hidden {
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }
      
      /* Pure Minimalist Panels */
      .glass-panel {
        background: #FFFFFF !important;
        border: 1px solid #E5E7EB !important;
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03) !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      
      .dark .glass-panel {
        background: #111827 !important;
        border: 1px solid #1F2937 !important;
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.15) !important;
      }

      /* Clean subtle shadows and borders */
      .card-minimal {
        background-color: #F8F9FA;
        border: 1px solid #E5E7EB;
        border-radius: 12px;
        transition: all var(--transition-speed) var(--transition-timing);
      }

      .dark .card-minimal {
        background-color: #111827;
        border: 1px solid #1F2937;
      }

      .card-minimal:hover {
        border-color: #A51C30;
      }

    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.19.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
